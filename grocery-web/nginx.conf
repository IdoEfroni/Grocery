server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Do NOT add a `types { ... }` block here. In nginx `types` REPLACES the
    # inherited MIME map rather than extending it, so declaring a single entry
    # drops every other type and nginx serves html/js/css as
    # application/octet-stream -- which browsers refuse to execute.
    # The barcode decoder's .wasm needs application/wasm (otherwise
    # WebAssembly.instantiateStreaming rejects, and on iOS WASM is the only
    # decode path), but the base image's /etc/nginx/mime.types has covered
    # that since nginx 1.21.1. Nothing to do here.

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/wasm;
    gzip_min_length 1024;

    # Vite emits content-hashed filenames for everything under /assets, so these
    # are safe to cache indefinitely -- a new build produces new names.
    # `expires` is deliberately not used alongside add_header here: it emits its
    # own Cache-Control, leaving two conflicting headers on every response.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # index.html must never be cached: it is what points at the hashed assets,
    # so a stale copy pins users to an old build after a deploy.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # SPA fallback: client-side routes such as /view and /products/:id have no
    # file on disk and must be served index.html rather than a 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
